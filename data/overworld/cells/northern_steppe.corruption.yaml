# The Visitor's progressing corruption of the Northern Steppe - see
# docs/visitor_corruption.md for the full design. Loaded by
# content/loader.py's load_region_corruption; consumed by
# Engine._check_region_corruption once the clock reaches each phase's
# (after_year, after_day).
#
# epicenter (100, 8) is legend "4" in northern_steppe.lvl - "a wide,
# terraced scar in the earth... dug with a patience nothing living seems
# to have" - the Visitor's active excavation site, doubling narratively
# as the necroship's own position hovering over it. Northern Steppe is
# the overworld cell grid's row 0 (data/overworld/cells.lvl), offset
# (0, 0), so its local coordinates equal the assembled overworld's global
# ones directly - no offset conversion needed for this cell. (A second
# corrupted cell at a non-zero grid offset would need one; not built yet,
# see docs/visitor_corruption.md.)
#
# Radius is Euclidean distance, with an organic, irregular edge layered
# on top (deterministic per-tile noise, capped at 6 tiles either way past
# radius 5 - see engine/game_map.py's apply_corruption_radius/
# _corruption_edge_noise) - not a clean circle, and deliberately not the
# clipped-square shape an earlier draft of this mechanic used (that read
# as industrially paved ground instead of corruption nature was giving
# way to, per explicit user feedback 2026-09-05). Only ever remaps
# still-pristine plains/forest/road tiles - the region's existing hand-
# authored Hollow Reach/Cinder Marches corruption is left untouched
# either way, so these radii describe how far the *new*, moving
# corruption front has spread, not a redraw of what's already there.
#
# The Watch Post's own overworld entrance (75, 72) is Euclidean distance
# ~68.7 from the epicenter - phase 3's radius (72) clears that with a
# small margin even accounting for the noise's worst case at that exact
# tile (verified directly: the noise value there shrinks the effective
# radius by about 1.2 tiles, nowhere near enough to matter at this
# margin). Picking a radius for a specific real-content target like this
# should always leave a few tiles of headroom past the raw distance,
# rather than landing exactly on it, for the same reason.
#
# Only 3 of the eventual 4 phases are authored so far (through the
# Watch Post's razing) - the final phase (day 170, "maximum corruption" -
# see docs/visitor_corruption.md's resolved day-threshold notes)
# additionally uncovers the two Hollow Reach Elder Age landmarks (legend
# "3"/"4") into real dungeons, which don't exist yet
# (docs/visitor_corruption.md's implementation step 5). Adding that
# phase now would fail load_region_corruption's known_dungeon_ids
# cross-check against dungeon ids that aren't real yet.
cell_id: northern_steppe
epicenter: [100, 8]
phases:
  - after_year: 87
    after_day: 80
    radius: 30
  - after_year: 87
    after_day: 110
    radius: 50
  - after_year: 87
    after_day: 140
    radius: 72
    raze_dungeon_id: northern_watch_post
