id: rootfall_hollow
name: Rootfall Hollow
starting_level: level_01
description: >
  A hollow out on Dust Reach that grew the way roots or mineral veins
  grow - branching outward from some long-gone center, rather than being
  carved by anyone. No ruin, no era, nothing built here at all; just
  ground that happened to open up this way and has stayed open ever
  since. Generated with tools/procgen/dla.py, one of a short run of small
  test dungeons proving out the procedural generation library - see
  docs/dungeon_bibles/rootfall_hollow.md and docs/procgen_algorithms.md.
inspect_text: A hollow that branches outward like roots or veins, not like anything anyone dug.
