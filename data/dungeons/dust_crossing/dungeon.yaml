id: dust_crossing
name: Dust Crossing
starting_level: level_01
requires_stairs_down: false
description: >
  A crossroads out on Dust Reach - no walls, no buildings yet, just a
  network of packed-dirt roads someone started walking often enough that
  they stayed roads instead of fading back to plain ground. Nobody's
  settled here in any lasting way; it reads as the very first mark of
  present-day people finding their way this far out, not a real
  settlement yet. Generated with tools/procgen/road_network.py, one of a
  short run of small test dungeons proving out the procedural generation
  library - see docs/dungeon_bibles/dust_crossing.md and
  docs/procgen_algorithms.md.
inspect_text: A crossroads of packed-dirt tracks, worn by feet and cart wheels but leading nowhere built yet.
