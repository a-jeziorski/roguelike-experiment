tile_kinds:
  wall:             {sheet: rltiles, name: dngn_rock_wall_00}
  floor:            {sheet: rltiles, name: floor_of_a_room}
  stairs_down:      {sheet: rltiles, name: staircase_down, backdrop: floor}
  stairs_up:        {sheet: rltiles, name: staircase_up, backdrop: floor}
  door:             {sheet: rltiles, name: closed_door_h}
  sea:              {sheet: kenney_roguelike, col: 0,  row: 2}
  # Dungeon-only standing water (see content/schema.py's deep_water) -
  # reuses sea's sprite tile, recolored via engine/render.py's TILE_KINDS.
  deep_water:       {sheet: kenney_roguelike, col: 0,  row: 2}
  plains:           {sheet: kenney_roguelike, col: 5,  row: 0}
  dunes:            {sheet: kenney_roguelike, col: 8, row: 0}
  road:             {sheet: kenney_roguelike, col: 6,  row: 0}
  forest:           {sheet: kenney_roguelike, col: 23, row: 9, backdrop: plains}
  landmark:         {sheet: kenney_roguelike, col: 51, row: 11, backdrop: plains}
  town:             {sheet: kenney_tiny_town, col: 7, row: 5}
  dungeon_entrance: {sheet: kenney_tiny_town, col: 2, row: 6, backdrop: plains}
  mountain:         {sheet: kenney_roguelike, col: 54, row: 21, backdrop: plains}
  ashen_plains:     {sheet: kenney_roguelike, col: 7,  row: 0}   # scorched grey ground, same "biome texture" style as plains/dunes/road above
  blighted_forest:  {sheet: kenney_roguelike, col: 27, row: 9, backdrop: ashen_plains}   # a bare, leafless tree - forest's dead counterpart
  scoured_ground:   {sheet: kenney_roguelike, col: 7,  row: 0}   # identical sprite to ashen_plains, deliberately - see engine/render.py's TILE_VISUALS comment

# Per-dungeon overworld entrance icons - keyed by dungeon registry id, not
# tile kind, since every dungeon_entrance cell shares one TileType but
# which dungeon it actually leads to (game_map.dungeon_entrances) is what
# picks the icon here. A dungeon id with no entry falls back to
# tile_kinds' generic dungeon_entrance archway above, then to ASCII - see
# engine/render.py's _resolved_tile_glyph.
dungeon_entrances:
  prison_tower: {sheet: kenney_roguelike, col: 50, row: 10, backdrop: plains}   # a grey stone keep/tower icon
  millhaven:    {sheet: kenney_tiny_town, col: 7, row: 5}     # the same roof-peak used for `town` above
  wayford:      {sheet: kenney_tiny_town, col: 7, row: 5}
  stonebridge:  {sheet: kenney_tiny_town, col: 7, row: 5}
  saltmarsh:    {sheet: kenney_tiny_town, col: 7, row: 5}
  # forgotten_ruins/elder_cairn/broken_watch/sunken_mine/drowned_waystation:
  # intentionally omitted - no sprite in either sheet fit well enough to be
  # worth forcing (same principle as mountain, above, before it was
  # hand-picked). Falls back to the generic archway. Add a line here
  # whenever a fitting one is found - zero code change required.

# Purely cosmetic map dressing - see content/schema.py's DecorationKind.
# Composited per-instance over whatever tile it's standing on, same as
# entities/items above (never a fixed `backdrop`, which is only meaningful
# for tile_kinds/dungeon_entrances' single-global-icon shape). All twelve
# coordinates below were located and visually verified against the real
# roguelikeSheet_transparent.png this session, not guessed.
decorations:
  table:            {sheet: kenney_roguelike, col: 18, row: 5}
  chair:            {sheet: kenney_roguelike, col: 21, row: 5}
  bed:              {sheet: kenney_roguelike, col: 14, row: 1}
  chest:            {sheet: kenney_roguelike, col: 33, row: 10}
  bookshelf:        {sheet: kenney_roguelike, col: 41, row: 12}
  fireplace:        {sheet: kenney_roguelike, col: 15, row: 8}
  flowerbed_white:  {sheet: kenney_roguelike, col: 0,  row: 9}
  flowerbed_blue:   {sheet: kenney_roguelike, col: 0,  row: 12}
  bush:             {sheet: kenney_roguelike, col: 19, row: 9}
  tree:             {sheet: kenney_roguelike, col: 16, row: 9}
  fence:            {sheet: kenney_roguelike, col: 47, row: 24}
  herb_clump:       {sheet: kenney_roguelike, col: 44, row: 23}
  # Added for Millhaven's third pass (a burying ground, a tilled plot, the
  # Trainer's practice range) - kenney_roguelike again for the tombstone
  # (no wheelbarrow found in either sheet despite a real search), kenney_
  # tiny_town for the rest, matching that sheet's existing use for
  # settlement/dungeon-entrance icons elsewhere in this file.
  tombstone:        {sheet: kenney_roguelike, col: 44, row: 8}
  tilled_soil:      {sheet: kenney_tiny_town, col: 1,  row: 2}
  archery_target:   {sheet: kenney_tiny_town, col: 11, row: 7}
  barrel:           {sheet: kenney_tiny_town, col: 11, row: 10}
  crate:            {sheet: kenney_tiny_town, col: 10, row: 10}
  # Added for Wayford's razed variant - rltiles for the one thing neither
  # Kenney sheet has any equivalent of (a generic rubble/debris pile); no
  # cart/wagon or burnt-furniture art exists in either sheet at all, so
  # the razed pass leans on this plus scoured_ground (TileType) rather
  # than forcing a bad-fit sprite. Only ever placed in *_ruins levels.
  rubble:           {sheet: rltiles, name: misc_stone}
  # Added for Prison Tower's decoration pass - rltiles again, nothing
  # prison-specific exists in either Kenney sheet (both are settlement/
  # overworld-furniture focused). Neither Kenney sheet has a weapon-rack
  # sprite either, despite a real search - the Armory reuses `chest` for
  # its stored gear instead of forcing a bad fit.
  cell_bars:        {sheet: rltiles, name: iron_bars}
  chains:           {sheet: rltiles, name: iron_chain}
  # Added for Forgotten Ruins' decoration pass - a scattered-bone pile
  # (rltiles) for the Ossuary/crypt levels, and cobwebs for the mundane,
  # long-neglected Rotting Cellar. A literal throne/altar sprite exists
  # in rltiles (`opulent_throne`, `altar`) but both read as gilded and
  # cross-adorned - wrong register entirely for "a stone seat, too large
  # for anything that still walks upright" - so the throne landmark stays
  # on the shared generic `landmark` glyph rather than forcing a bad fit.
  bones:            {sheet: rltiles, name: bone}
  cobwebs:          {sheet: rltiles, name: web}
  # Added for the Drowned Waystation's decoration pass - a dried kelp
  # strand (rltiles) for floor near the sea tiles, reinforcing "the
  # water's been here a while" without needing a bespoke flood-debris
  # sprite. green_mold/brown_mold/fungus were considered and rejected -
  # all three read as creature sprites (blob/mushroom silhouettes), too
  # easily mistaken for a monster at a glance; coral was rejected as too
  # vividly tropical for this dungeon's washed-out mood.
  kelp:             {sheet: rltiles, name: kelp_frond}

# Per-coordinate sprite overrides - see content/schema.py's
# LegendEntry.tile_sprite. Author-chosen ids, not tied to TileType or any
# catalog; registered/backdrop-baked the same way as dungeon_entrances
# above (a named, one-off icon), not composited per-instance like
# decorations above.
tile_sprite_overrides:
  # A real, unused, name-indexed rltiles sprite - same sheet/style already
  # used for every stairs_up/stairs_down tile in the game. backdrop: road,
  # not floor (unlike stairs_up's own entry), since every use of this so
  # far is an outdoor town gate sitting on a road tile, not an indoor
  # staircase.
  town_gate: {sheet: rltiles, name: dngn_stone_arch, backdrop: road}
  # Millhaven's landmarks, each on plains ground - same backdrop as the
  # generic `landmark` tile_kinds entry they replace for this one placement.
  well:         {sheet: kenney_tiny_town, col: 8,  row: 8, backdrop: plains}
  notice_board: {sheet: kenney_tiny_town, col: 11, row: 6, backdrop: plains}
  mending_yard: {sheet: kenney_tiny_town, col: 8,  row: 9, backdrop: plains}