# Bitmap sprite mapping: which catalog entity/item id, or which overworld
# tile kind, uses which sprite from which source sheet - see
# content/schema.py's SpriteManifestDef/SpriteRef/SpriteSheetDef for the
# full field list and content/loader.py's load_sprite_manifest for
# validation. Anything not listed under entities/items/tile_kinds simply
# has no sprite - engine/render.py falls back to that id/kind's authored
# ASCII glyph, so leaving something out (e.g. mountain, deliberately - see
# tile_kinds below) is always safe, never a broken reference.
#
# A SpriteRef addresses its tile either by `name` (looked up in the sheet's
# own name->index JSON, when it has one) or by `col`+`row` (direct grid
# position) - never both. `recolor: true` retints a shared base sprite
# toward that catalog entry's own `color` field (see
# engine/sprites.py's recolor_sprite) - used wherever several entries
# reuse one base sprite with no distinct art of their own, so they still
# read as visually distinct from each other.
#
# `backdrop: <tile_kind>` composites an icon-style tile_kinds/
# dungeon_entrances sprite (a single tree/peak/tower on an otherwise
# transparent square, unlike a full-bleed texture like plains/sea/wall)
# over that tile_kinds entry once, at registration time - otherwise its
# transparent background renders as the console's plain black. Only
# meaningful on tile_kinds/dungeon_entrances (entities/items already get
# this dynamically, over whatever they're actually standing on); the
# referenced tile_kind must itself have no backdrop (no chaining).
#
# Sources (see assets/tilesets/LICENSE_*.txt): RLTiles (public domain,
# https://github.com/statico/rltiles) for most creatures/items, dungeon
# features (wall/floor/door/stairs), and the player; Kenney's Roguelike/RPG
# pack and Tiny Town (both CC0, kenney.nl) for overworld terrain and the
# two settlement/dungeon-entrance tile kinds.
#
# `entities` also accepts one reserved id, "player" (see
# content.loader.PLAYER_ENTITY_ID) - the player isn't a real catalog entry
# (it's hardcoded in engine/game_map.py, not authored in entities.yaml), so
# it's exempt from the "must exist in the catalog" check and can't use
# recolor (no EntityDef/.color field to tint toward).

sheets:
  rltiles:
    image: rltiles-2d.png
    index: rltiles-2d.json
    tile_size: 32
  kenney_roguelike:
    image: roguelikeSheet_transparent.png
    tile_size: 16
    spacing: 1
    columns: 57
    rows: 31
  kenney_tiny_town:
    image: tiny_town_tilemap.png
    tile_size: 16
    spacing: 1
    columns: 12
    rows: 11

