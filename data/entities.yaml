# Monster catalog. Referenced by id from level files' legends (e.g. {entity: rat}).
# Edit stats here to rebalance every level that uses this monster at once.

rat:
  name: Rat
  glyph: r
  color: [140, 90, 60]
  hp: 6
  attack: 2
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  description: A mangy sewer rat. Weak alone, dangerous in numbers - and quick to bolt once wounded.

goblin:
  name: Goblin
  glyph: g
  color: [60, 140, 60]
  hp: 12
  attack: 4
  defense: 1
  ai: hostile_basic
  xp_reward: 5
  description: A snarling green raider with a rusty blade.

cave_spider:
  name: Cave Spider
  glyph: x
  color: [120, 90, 130]
  hp: 7
  attack: 3
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  # A conservative first pass, roughly doubling one bite's total effective
  # damage (3 direct + 3 poison over 3 turns) - exact tuning deferred to
  # the upcoming Silversilk Caves rebalance pass (docs/content_design_process.md §0t/§2).
  inflicts_effect: poison
  inflicts_potency: 1
  inflicts_duration: 3
  description: A fist-sized skitterer that drops from the dark on a single thread. Bites hard for its size, then bolts.

skeleton:
  name: Skeleton
  glyph: s
  color: [210, 210, 190]
  hp: 16
  attack: 5
  defense: 2
  ai: sleeping_guard
  alert_radius: 4
  xp_reward: 7
  description: Bones held together by old, grim magic. Stands motionless until disturbed.

skeleton_archer:
  name: Skeleton Archer
  glyph: S
  color: [190, 190, 170]
  hp: 12
  attack: 4
  defense: 1
  ai: ranged_basic
  ranged_range: 5
  xp_reward: 5
  description: An animated skeleton archer, notched arrow ready. Keeps its distance.

ogre:
  name: Ogre
  glyph: O
  color: [110, 80, 50]
  hp: 28
  attack: 8
  defense: 3
  ai: hostile_basic
  xp_reward: 14
  description: A hulking brute that guards the deepest halls.

guard:
  name: Guard
  glyph: G
  color: [90, 100, 130]
  hp: 14
  attack: 5
  defense: 2
  ai: hostile_basic
  xp_reward: 5
  description: A prison guard in scuffed leather armor, club in hand.

feral_prisoner:
  name: Feral Prisoner
  glyph: p
  color: [130, 110, 90]
  hp: 8
  attack: 3
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  description: A prisoner broken by years in the dark. Lashes out, then flees.

crossbow_guard:
  name: Crossbow Guard
  glyph: C
  color: [110, 90, 60]
  hp: 10
  attack: 4
  defense: 1
  ai: ranged_basic
  ranged_range: 5
  xp_reward: 5
  description: A guard with a loaded crossbow, watching the halls from a distance.

warden:
  name: Warden
  glyph: W
  color: [140, 40, 40]
  hp: 26
  attack: 7
  defense: 3
  ai: hostile_basic
  xp_reward: 12
  description: The tower's warden. Not eager to let his prize escape.

villager:
  name: Villager
  glyph: v
  color: [170, 140, 90]
  # hp is deliberately above the player's base attack (5) so a first hit is
  # survivable and the flee behavior is actually visible, not just "villager
  # dies before it can react" - still low enough to die to a couple of hits
  # or any real weapon, since they're not meant to be fought at length.
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  description: A local going about their day. Won't raise a hand against you - but won't stick around if you raise one against them.
  dialogue: They nod, but don't have much to say.

escaped_prisoner:
  name: Escaped Prisoner
  glyph: e
  color: [150, 130, 110]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  description: Got out of Prison Tower somehow, and has never quite stopped flinching at loud noises since.
  dialogue: Made it out of that tower same as you, more or less. Warden ever come looking for me, or is he still up there thinking he runs the place?

village_chief:
  name: Village Chief
  glyph: V
  color: [225, 190, 100]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: >
    Millhaven's chief - no title with much real weight behind it these
    days, just the one whose word people still bother to listen to.

shopkeeper:
  name: Shopkeeper
  glyph: m
  color: [200, 160, 70]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Deals in coin, on the rare occasion anyone still has any to deal in.
  dialogue: Coin still spends here, same as it always did. Rare enough these days that I don't ask where it came from.
  shop_inventory: [healing_potion, teleportation_potion]

millhaven_trainer:
  name: Old Drillmaster
  glyph: d
  color: [150, 130, 100]
  hp: 12
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Used to drill Kingdom levies before there was a Kingdom left to levy them for. Still willing to pass on what stuck.
  dialogue: Killing things and surviving quests teaches a body plenty, if it's paying attention. I can put what you've picked up to better use than instinct alone would.
  trainer_perks: [toughness_1, weapon_training_1, shield_training_1, marksman_training_1]

millhaven_debtor:
  name: Debtor
  glyph: b
  color: [150, 110, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Owes coin to someone back in Wayford, and has clearly been hoping the debt would just be forgotten.
  dialogue: I know what I owe, and I know who to. Tell them I'm good for it - just not yet.

town_guard:
  name: Town Guard
  glyph: T
  color: [130, 140, 110]
  hp: 14
  attack: 5
  defense: 2
  ai: town_guard
  description: Keeps the peace here, mostly by not needing to.
  dialogue: Keep the peace and we've got no trouble between us.

wayford_road_warden:
  name: Road Warden
  glyph: R
  color: [160, 100, 70]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Watches the west road out of Wayford - or watches for word of it, when watching it directly isn't safe.
  dialogue: Road west isn't safe past the old watchtower. Been saying it for weeks - carts turn back before they even reach Broken Watch.

wayford_clerk:
  name: Town Clerk
  glyph: c
  color: [140, 150, 170]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Keeps what records Wayford still has, and wants back what it doesn't.
  dialogue: Half our own records burned or scattered before I ever took this desk. If Broken Watch's old muster survived, I'd very much like to know what it says.

wayford_caravan_master:
  name: Caravan Master
  glyph: M
  color: [190, 150, 80]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Used to run carts to Millhaven on a schedule. Hasn't sent one out in longer than they'd like to admit.
  dialogue: Used to run a cart to Millhaven every season, back before anyone thought twice about it. Haven't sent one in longer than I'd like to admit.

wayford_provisioner:
  name: Provisioner
  glyph: P
  color: [210, 175, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Runs the biggest stall in Wayford's market, and has for years. Coin spends here without a second thought.
  dialogue: Been trading out of this stall longer than most folks in this town have been alive. Coin's good here - always has been.
  shop_inventory: [healing_potion, teleportation_potion, rusty_dagger, leather_armor]

wayford_trainer:
  name: Retired Sellsword
  glyph: y
  color: [160, 120, 100]
  hp: 12
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Hung up the blade years back, but not the habit of watching how everyone else holds theirs.
  dialogue: You've been out there, killed things, done what people asked of you - that's worth more than coin, if you know where to spend it. I know where.
  trainer_perks: [toughness_1, weapon_training_1, shield_training_1, marksman_training_1]

saltmarsh_witch:
  name: Witch
  glyph: W
  color: [210, 175, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Brews potions for the townsfolk. They tolerate her eccentricity in exchange.
  dialogue: Step right up deary. Have I got brews for you!
  shop_inventory: [healing_potion, teleportation_potion]

saltmarsh_elder:
  name: Elder
  glyph: E
  color: [200, 190, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Remembers Saltmarsh before the Drowned Waystation was a ruin offshore, and still asks after anyone who's been near it.

stonebridge_lookout:
  name: Lookout
  glyph: N
  color: [180, 170, 140]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Keeps watch from the gatehouse nook toward the hills and Broken Watch beyond them - the one post in Stonebridge that's never left empty.

grey_valley_elder:
  name: Elder
  glyph: E
  color: [200, 190, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Leads the community that took over Grey Valley Monastery's ruins - the one whose word carries furthest in a place this small and this far from anywhere else.

grey_valley_weaver:
  name: Weaver
  glyph: w
  color: [150, 110, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Turns hunted cave-spider silk into the one thing this isolated settlement has ever had worth trading.
  shop_inventory: [healing_potion, teleportation_potion]

windbreak_captain:
  name: Captain
  glyph: c
  color: [170, 140, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Leads whoever's proven capable of keeping a season-old camp alive out on the Scoured Reach - a working title, not an inherited one.

farrows_scout:
  name: Scout
  glyph: s
  color: [140, 160, 110]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Walked the surveyed route from end to end and found the one thing blocking it - a den nobody's cleared yet.

bandit:
  name: Bandit
  glyph: b
  color: [150, 60, 50]
  hp: 13
  attack: 5
  defense: 1
  ai: hostile_basic
  xp_reward: 5
  description: A ragged raider squatting in what used to be Kingdom infrastructure. Fights for what's in your pockets, not for a cause.

bandit_captain:
  name: Bandit Captain
  glyph: B
  color: [175, 45, 30]
  hp: 20
  attack: 7
  defense: 2
  ai: hostile_basic
  xp_reward: 9
  description: Whoever's left standing at the top of the watchtower's rickety hierarchy. Wears looted Kingdom mail like it was always his.

windrest_captain:
  name: Bandit Captain
  glyph: B
  color: [175, 45, 30]
  hp: 20
  attack: 7
  defense: 2
  ai: hostile_basic
  xp_reward: 9
  # Own catalog id, not a reused `bandit_captain` spawn, deliberately - a
  # kill quest's completion check (QuestLog.killed_entity_ids) is a global
  # boolean, correct only for a catalog id that spawns in exactly one
  # place in the whole game (see docs/content_design_process.md §0o).
  # Broken Watch already owns `bandit_captain` for two of its own quests;
  # a second dungeon spawning that same id would let killing either one
  # complete both dungeons' kill quests. Identical stats otherwise - same
  # role, same balance, just its own id.
  description: Whoever's currently strong enough to hold the Windrest's one dry, sealed corner. Took the shelter for its walls, same as everyone else here.

drowned_wretch:
  name: Drowned Wretch
  glyph: d
  color: [80, 120, 110]
  hp: 11
  attack: 4
  defense: 0
  ai: hostile_basic
  xp_reward: 5
  description: Once someone was posted here, before the sea came in. What's left doesn't remember that, or much else.

stone_sentinel:
  name: Stone Sentinel
  glyph: Q
  color: [130, 130, 140]
  hp: 30
  attack: 5
  defense: 3
  ai: hostile_basic
  xp_reward: 15
  description: A construct of seamless, grown stone, posted at the Cairn since before anyone kept records. Slow. Patient. Still on duty.

# Bestiary expansion - not yet placed in any level, kept here for future
# dungeons to draw on (see docs/content_design_process.md's balance
# methodology for the hits-to-kill math these stats were checked against).

giant_rat:
  name: Giant Rat
  glyph: n
  color: [110, 75, 55]
  hp: 10
  attack: 3
  defense: 0
  ai: regenerator
  # A conservative first pass (2 hp/turn on a 10-hp body) - exact tuning
  # deferred like cave_spider's poison above, but enough that ignoring it
  # for a few turns visibly undoes progress (docs/content_design_process.md §0u).
  regen_amount: 2
  xp_reward: 5
  description: Bigger and bolder than the sewer kind - wounds close over almost as fast as it takes them, and it doesn't scatter when you swing.

wolf:
  name: Wolf
  glyph: w
  color: [120, 120, 130]
  hp: 14
  attack: 5
  defense: 1
  ai: pack_hunter
  # "Circles before it commits" made mechanical - hits harder once another
  # wolf is close enough to also be in the fight (docs/content_design_process.md §0u).
  pack_radius: 3
  pack_attack_bonus: 2
  xp_reward: 5
  description: Lean and half-feral, running with whatever's left of a pack. Circles before it commits.

kobold:
  name: Kobold
  glyph: k
  color: [150, 120, 60]
  hp: 8
  attack: 3
  defense: 0
  ai: hostile_basic
  xp_reward: 3
  description: Small, wiry, and quick to pile in three-deep rather than fight fair alone.

kobold_shaman:
  name: Kobold Shaman
  glyph: K
  color: [140, 90, 150]
  hp: 9
  attack: 3
  defense: 0
  ai: ranged_basic
  ranged_range: 4
  xp_reward: 4
  description: Chants something old and half-remembered, and the air around its hand does something anyway.

orc:
  name: Orc
  glyph: o
  color: [80, 110, 70]
  hp: 15
  attack: 5
  defense: 1
  ai: enrage
  # Unhurried until it's actually losing - below 30% hp (4 of 15) it stops
  # being confident and starts swinging like it knows it might lose
  # (docs/content_design_process.md §0u).
  enrage_hp_pct: 0.3
  enrage_attack_bonus: 3
  xp_reward: 6
  description: Broad-shouldered and unhurried about closing the distance - it's confident it doesn't need to be fast. Corner it, and that confidence turns to fury.

hobgoblin:
  name: Hobgoblin
  glyph: h
  color: [70, 130, 90]
  hp: 18
  attack: 6
  defense: 2
  ai: hostile_basic
  xp_reward: 7
  description: Disciplined where its smaller kin are chaos - drills the ones under it, and fights like it too.

wraith:
  name: Wraith
  glyph: "Y"
  color: [90, 90, 130]
  hp: 20
  attack: 6
  defense: 2
  ai: sleeping_guard
  alert_radius: 4
  xp_reward: 9
  # A single lost turn per landed hit - modest on its own, but stacked on
  # top of sleeping_guard's ambush potential (the player is often already
  # adjacent and mid-fight before it wakes), a first hit that stuns can
  # cost a second free hit on top of the direct damage. Kept to duration 1
  # rather than something longer for exactly that reason.
  inflicts_effect: stun
  inflicts_duration: 1
  description: A shape the light won't quite settle on, guarding something that predates whatever built the walls around it.

gray_ooze:
  name: Gray Ooze
  glyph: j
  color: [130, 140, 120]
  hp: 16
  attack: 4
  defense: 1
  ai: hostile_basic
  xp_reward: 6
  # "Both wear down eventually" made mechanical - a corrosive touch that
  # saps attack for a few turns, same duration precedent as poison's
  # giant_spider entry. A fight against more than one ooze compounds this
  # into a real problem, not just flavor.
  inflicts_effect: weaken
  inflicts_potency: 2
  inflicts_duration: 3
  description: Formless, patient, and indifferent to the difference between stone and flesh. Both wear down eventually.

giant_spider:
  name: Giant Spider
  glyph: "X"
  color: [70, 50, 80]
  hp: 20
  attack: 7
  defense: 1
  ai: hostile_basic
  xp_reward: 9
  inflicts_effect: poison
  inflicts_potency: 2
  inflicts_duration: 3
  description: Broods somewhere the ceiling goes dark, wrapped in more silk than any one meal could explain.
