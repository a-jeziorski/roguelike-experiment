# Monster catalog. Referenced by id from level files' legends (e.g. {entity: rat}).
# Edit stats here to rebalance every level that uses this monster at once.

rat:
  name: Rat
  glyph: r
  color: [140, 90, 60]
  hp: 6
  attack: 2
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  description: A mangy sewer rat. Weak alone, dangerous in numbers - and quick to bolt once wounded.

goblin:
  name: Goblin
  glyph: g
  color: [60, 140, 60]
  hp: 12
  attack: 4
  defense: 1
  ai: hostile_basic
  xp_reward: 5
  # A conservative first pass on drop odds across the board - common
  # humanoid raiders have some chance of carrying coin, nothing guaranteed
  # (docs/content_design_process.md §0v).
  drop_item_id: gold_pile
  drop_chance: 0.25
  description: A snarling green raider with a rusty blade.

cave_spider:
  name: Cave Spider
  glyph: x
  color: [120, 90, 130]
  hp: 7
  attack: 3
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  # A conservative first pass, roughly doubling one bite's total effective
  # damage (3 direct + 3 poison over 3 turns) - exact tuning deferred to
  # the upcoming Silversilk Caves rebalance pass (docs/content_design_process.md §0t/§2).
  inflicts_effect: poison
  inflicts_potency: 1
  inflicts_duration: 3
  description: A fist-sized skitterer that drops from the dark on a single thread. Bites hard for its size, then bolts.

skeleton:
  name: Skeleton
  glyph: s
  color: [210, 210, 190]
  hp: 16
  attack: 5
  defense: 2
  ai: sleeping_guard
  alert_radius: 4
  xp_reward: 7
  description: Bones held together by old, grim magic. Stands motionless until disturbed.

skeleton_archer:
  name: Skeleton Archer
  glyph: S
  color: [190, 190, 170]
  hp: 12
  attack: 4
  defense: 1
  ai: ranged_basic
  ranged_range: 5
  xp_reward: 5
  description: An animated skeleton archer, notched arrow ready. Keeps its distance.

ogre:
  name: Ogre
  glyph: O
  color: [110, 80, 50]
  hp: 28
  attack: 8
  defense: 3
  ai: hostile_basic
  xp_reward: 14
  # A real weapon upgrade, not just coin - fits a solitary guardian rather
  # than a common raider. An elite spawn of this entity (see §0w) turns
  # this into a guarantee (docs/content_design_process.md §0v/§0w).
  drop_item_id: iron_sword
  drop_chance: 0.4
  description: A hulking brute that guards the deepest halls.

guard:
  name: Guard
  glyph: G
  color: [90, 100, 130]
  hp: 14
  attack: 5
  defense: 2
  ai: hostile_basic
  xp_reward: 5
  drop_item_id: gold_pile
  drop_chance: 0.25
  description: A prison guard in scuffed leather armor, club in hand.

feral_prisoner:
  name: Feral Prisoner
  glyph: p
  color: [130, 110, 90]
  hp: 8
  attack: 3
  defense: 0
  ai: skittish
  flee_hp_pct: 0.4
  xp_reward: 3
  description: A prisoner broken by years in the dark. Lashes out, then flees.

crossbow_guard:
  name: Crossbow Guard
  glyph: C
  color: [110, 90, 60]
  hp: 10
  attack: 4
  defense: 1
  ai: ranged_basic
  ranged_range: 5
  xp_reward: 5
  drop_item_id: gold_pile
  drop_chance: 0.25
  description: A guard with a loaded crossbow, watching the halls from a distance.

warden:
  name: Warden
  glyph: W
  color: [140, 40, 40]
  hp: 26
  attack: 7
  defense: 3
  ai: hostile_basic
  xp_reward: 12
  description: The tower's warden. Not eager to let his prize escape.

villager:
  name: Villager
  glyph: v
  color: [170, 140, 90]
  # hp is deliberately above the player's base attack (5) so a first hit is
  # survivable and the flee behavior is actually visible, not just "villager
  # dies before it can react" - still low enough to die to a couple of hits
  # or any real weapon, since they're not meant to be fought at length.
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  description: A local going about their day. Won't raise a hand against you - but won't stick around if you raise one against them.
  dialogue: They nod, but don't have much to say.

escaped_prisoner:
  name: Escaped Prisoner
  glyph: e
  color: [150, 130, 110]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  description: Got out of Prison Tower somehow, and has never quite stopped flinching at loud noises since.
  dialogue: Made it out of that tower same as you, more or less. Warden ever come looking for me, or is he still up there thinking he runs the place?

village_chief:
  name: Village Chief
  glyph: V
  color: [225, 190, 100]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: >
    Millhaven's chief - no title with much real weight behind it these
    days, just the one whose word people still bother to listen to.

shopkeeper:
  name: Shopkeeper
  glyph: m
  color: [200, 160, 70]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Deals in coin, on the rare occasion anyone still has any to deal in.
  dialogue: Coin still spends here, same as it always did. Rare enough these days that I don't ask where it came from.
  shop_inventory: [healing_potion, teleportation_potion]

millhaven_trainer:
  name: Old Drillmaster
  glyph: d
  color: [150, 130, 100]
  hp: 12
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Used to drill Kingdom levies before there was a Kingdom left to levy them for. Still willing to pass on what stuck.
  dialogue: Killing things and surviving quests teaches a body plenty, if it's paying attention. I can put what you've picked up to better use than instinct alone would.
  trainer_perks: [
    toughness_1, toughness_2, weapon_training_1, shield_training_1, marksman_training_1,
    steady_aim, light_feet, second_wind, ground_pound,
  ]

millhaven_debtor:
  name: Debtor
  glyph: b
  color: [150, 110, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Owes coin to someone back in Wayford, and has clearly been hoping the debt would just be forgotten.
  dialogue: I know what I owe, and I know who to. Tell them I'm good for it - just not yet.

town_guard:
  name: Town Guard
  glyph: T
  color: [130, 140, 110]
  hp: 14
  attack: 5
  defense: 2
  ai: town_guard
  description: Keeps the peace here, mostly by not needing to.
  dialogue: Keep the peace and we've got no trouble between us.

wayford_road_warden:
  name: Road Warden
  glyph: R
  color: [160, 100, 70]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Watches the west road out of Wayford - or watches for word of it, when watching it directly isn't safe.
  dialogue: Road west isn't safe past the old watchtower. Been saying it for weeks - carts turn back before they even reach Broken Watch.

wayford_clerk:
  name: Town Clerk
  glyph: c
  color: [140, 150, 170]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Keeps what records Wayford still has, and wants back what it doesn't.
  dialogue: Half our own records burned or scattered before I ever took this desk. If Broken Watch's old muster survived, I'd very much like to know what it says.

wayford_caravan_master:
  name: Caravan Master
  glyph: M
  color: [190, 150, 80]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Used to run carts to Millhaven on a schedule. Hasn't sent one out in longer than they'd like to admit.
  dialogue: Used to run a cart to Millhaven every season, back before anyone thought twice about it. Haven't sent one in longer than I'd like to admit.

wayford_provisioner:
  name: Provisioner
  glyph: P
  color: [210, 175, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Runs the biggest stall in Wayford's market, and has for years. Coin spends here without a second thought.
  dialogue: Been trading out of this stall longer than most folks in this town have been alive. Coin's good here - always has been.
  shop_inventory: [healing_potion, teleportation_potion, rusty_dagger, leather_armor, lucky_charm]

wayford_trainer:
  name: Retired Sellsword
  glyph: y
  color: [160, 120, 100]
  hp: 12
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Hung up the blade years back, but not the habit of watching how everyone else holds theirs.
  dialogue: You've been out there, killed things, done what people asked of you - that's worth more than coin, if you know where to spend it. I know where.
  trainer_perks: [
    toughness_1, toughness_2, weapon_training_1, shield_training_1, marksman_training_1,
    steady_aim, light_feet, second_wind, ground_pound,
  ]

saltmarsh_witch:
  name: Witch
  glyph: W
  color: [210, 175, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Brews potions for the townsfolk. They tolerate her eccentricity in exchange.
  dialogue: Step right up deary. Have I got brews for you!
  shop_inventory: [healing_potion, teleportation_potion, shadow_cloak_pin]

saltmarsh_elder:
  name: Elder
  glyph: E
  color: [200, 190, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Remembers Saltmarsh before the Drowned Waystation was a ruin offshore, and still asks after anyone who's been near it.

stonebridge_lookout:
  name: Lookout
  glyph: N
  color: [180, 170, 140]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Keeps watch from the gatehouse nook toward the hills and Broken Watch beyond them - the one post in Stonebridge that's never left empty.

grey_valley_elder:
  name: Elder
  glyph: E
  color: [200, 190, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Leads the community that took over Grey Valley Monastery's ruins - the one whose word carries furthest in a place this small and this far from anywhere else.

grey_valley_weaver:
  name: Weaver
  glyph: w
  color: [150, 110, 160]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Turns hunted cave-spider silk into the one thing this isolated settlement has ever had worth trading.
  shop_inventory: [healing_potion, teleportation_potion, scholars_pendant]

windbreak_captain:
  name: Captain
  glyph: c
  color: [170, 140, 90]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Leads whoever's proven capable of keeping a season-old camp alive out on the Scoured Reach - a working title, not an inherited one.

farrows_scout:
  name: Scout
  glyph: s
  color: [140, 160, 110]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Walked the surveyed route from end to end and found the one thing blocking it - a den nobody's cleared yet.

bandit:
  name: Bandit
  glyph: b
  color: [150, 60, 50]
  hp: 13
  attack: 5
  defense: 1
  ai: hostile_basic
  xp_reward: 5
  drop_item_id: gold_pile
  drop_chance: 0.3
  description: A ragged raider squatting in what used to be Kingdom infrastructure. Fights for what's in your pockets, not for a cause.

bandit_captain:
  name: Bandit Captain
  glyph: B
  color: [175, 45, 30]
  hp: 20
  attack: 7
  defense: 2
  ai: hostile_basic
  xp_reward: 9
  # A leader's cut is a better bet than a follower's - guaranteed instead
  # of a coin flip, and the bigger stash (docs/content_design_process.md §0v).
  drop_item_id: gold_stash
  drop_chance: 1.0
  description: Whoever's left standing at the top of the watchtower's rickety hierarchy. Wears looted Kingdom mail like it was always his.

windrest_captain:
  name: Bandit Captain
  glyph: B
  color: [175, 45, 30]
  hp: 20
  attack: 7
  defense: 2
  ai: hostile_basic
  xp_reward: 9
  drop_item_id: gold_stash
  drop_chance: 1.0
  # Own catalog id, not a reused `bandit_captain` spawn, deliberately - a
  # kill quest's completion check (QuestLog.killed_entity_ids) is a global
  # boolean, correct only for a catalog id that spawns in exactly one
  # place in the whole game (see docs/content_design_process.md §0o).
  # Broken Watch already owns `bandit_captain` for two of its own quests;
  # a second dungeon spawning that same id would let killing either one
  # complete both dungeons' kill quests. Identical stats otherwise - same
  # role, same balance, just its own id.
  description: Whoever's currently strong enough to hold the Windrest's one dry, sealed corner. Took the shelter for its walls, same as everyone else here.

drowned_wretch:
  name: Drowned Wretch
  glyph: d
  color: [80, 120, 110]
  hp: 11
  attack: 4
  defense: 0
  ai: hostile_basic
  xp_reward: 5
  description: Once someone was posted here, before the sea came in. What's left doesn't remember that, or much else.

stone_sentinel:
  name: Stone Sentinel
  glyph: Q
  color: [130, 130, 140]
  hp: 30
  attack: 5
  defense: 3
  ai: hostile_basic
  xp_reward: 15
  description: A construct of seamless, grown stone, posted at the Cairn since before anyone kept records. Slow. Patient. Still on duty.

# Bestiary expansion - not yet placed in any level, kept here for future
# dungeons to draw on (see docs/content_design_process.md's balance
# methodology for the hits-to-kill math these stats were checked against).

giant_rat:
  name: Giant Rat
  glyph: n
  color: [110, 75, 55]
  hp: 10
  attack: 3
  defense: 0
  ai: regenerator
  # A conservative first pass (2 hp/turn on a 10-hp body) - exact tuning
  # deferred like cave_spider's poison above, but enough that ignoring it
  # for a few turns visibly undoes progress (docs/content_design_process.md §0u).
  regen_amount: 2
  xp_reward: 5
  description: Bigger and bolder than the sewer kind - wounds close over almost as fast as it takes them, and it doesn't scatter when you swing.

wolf:
  name: Wolf
  glyph: w
  color: [120, 120, 130]
  hp: 14
  attack: 5
  defense: 1
  ai: pack_hunter
  # "Circles before it commits" made mechanical - hits harder once another
  # wolf is close enough to also be in the fight (docs/content_design_process.md §0u).
  pack_radius: 3
  pack_attack_bonus: 2
  xp_reward: 5
  description: Lean and half-feral, running with whatever's left of a pack. Circles before it commits.

kobold:
  name: Kobold
  glyph: k
  color: [150, 120, 60]
  hp: 8
  attack: 3
  defense: 0
  ai: hostile_basic
  xp_reward: 3
  description: Small, wiry, and quick to pile in three-deep rather than fight fair alone.

kobold_shaman:
  name: Kobold Shaman
  glyph: K
  color: [140, 90, 150]
  hp: 9
  attack: 3
  defense: 0
  ai: ranged_basic
  ranged_range: 4
  xp_reward: 4
  description: Chants something old and half-remembered, and the air around its hand does something anyway.

orc:
  name: Orc
  glyph: o
  color: [80, 110, 70]
  hp: 15
  attack: 5
  defense: 1
  ai: enrage
  # Unhurried until it's actually losing - below 30% hp (4 of 15) it stops
  # being confident and starts swinging like it knows it might lose
  # (docs/content_design_process.md §0u).
  enrage_hp_pct: 0.3
  enrage_attack_bonus: 3
  xp_reward: 6
  description: Broad-shouldered and unhurried about closing the distance - it's confident it doesn't need to be fast. Corner it, and that confidence turns to fury.

hobgoblin:
  name: Hobgoblin
  glyph: h
  color: [70, 130, 90]
  hp: 18
  attack: 6
  defense: 2
  ai: hostile_basic
  xp_reward: 7
  description: Disciplined where its smaller kin are chaos - drills the ones under it, and fights like it too.

wraith:
  name: Wraith
  glyph: "Y"
  color: [90, 90, 130]
  hp: 20
  attack: 6
  defense: 2
  ai: sleeping_guard
  alert_radius: 4
  xp_reward: 9
  # A single lost turn per landed hit - modest on its own, but stacked on
  # top of sleeping_guard's ambush potential (the player is often already
  # adjacent and mid-fight before it wakes), a first hit that stuns can
  # cost a second free hit on top of the direct damage. Kept to duration 1
  # rather than something longer for exactly that reason.
  inflicts_effect: stun
  inflicts_duration: 1
  description: A shape the light won't quite settle on, guarding something that predates whatever built the walls around it.

gray_ooze:
  name: Gray Ooze
  glyph: j
  color: [130, 140, 120]
  hp: 16
  attack: 4
  defense: 1
  ai: hostile_basic
  xp_reward: 6
  # "Both wear down eventually" made mechanical - a corrosive touch that
  # saps attack for a few turns, same duration precedent as poison's
  # giant_spider entry. A fight against more than one ooze compounds this
  # into a real problem, not just flavor.
  inflicts_effect: weaken
  inflicts_potency: 2
  inflicts_duration: 3
  description: Formless, patient, and indifferent to the difference between stone and flesh. Both wear down eventually.

giant_spider:
  name: Giant Spider
  glyph: "X"
  color: [70, 50, 80]
  hp: 20
  attack: 7
  defense: 1
  ai: hostile_basic
  xp_reward: 9
  inflicts_effect: poison
  inflicts_potency: 2
  inflicts_duration: 3
  description: Broods somewhere the ceiling goes dark, wrapped in more silk than any one meal could explain.

# The Visitor's creations (docs/main_story.md, docs/region_bibles/northern_steppe.md) -
# not yet placed in any level, same "define now, place later" pattern as
# the bestiary expansion above. A deliberately new, higher power band: the
# existing roster above tops out around hp 28-30/attack 8/defense 3 (ogre,
# stone_sentinel), calibrated against a player near baseline stats. These
# six are calibrated against a player who has thoroughly cleared the
# Heartlands - roughly 300 XP spent on perks (both Toughness tiers +
# Weapon/Shield Training + both rate perks - Steady Aim, Light Feet -
# comes to exactly 300 XP, see data/perks.yaml) plus a mid-upper gear
# tier already found (a broadsword/bone_plate/orcish_bow-equivalent, not
# necessarily the rarest drop of each slot) - call this the "reference
# build": ~43 hp, ~12 effective melee attack, ~6 effective defense
# (tools/balance.py's build_xp_total confirms the perk+gear math). A
# fully optimized version of the same build (banded_mail instead of
# bone_plate, say) pushes defense toward ~9 - hits-to-kill math below was
# checked against both ends of that range, not just one point. Three
# tiers, matching the region's own
# corruption bands: Frayed Edge (challenging), Cinder Marches (very
# dangerous), Hollow Reach (extremely dangerous, deliberately matching
# the eventual necroship's own difficulty - see the region bible).

ash_bound_husk:
  name: Ash-Bound Husk
  glyph: z
  color: [120, 110, 100]
  hp: 30
  attack: 13
  defense: 2
  ai: pack_hunter
  # Crude and low-defense on its own (the Visitor's least deliberate
  # creation) - the danger is entirely in numbers, same "circles before it
  # commits" pack math as wolf above, just at Northern Steppe's higher
  # damage tier (docs/content_design_process.md §0u).
  pack_radius: 3
  pack_attack_bonus: 2
  xp_reward: 20
  description: Whatever this used to be, the shape barely holds now - ash-grey and half-collapsed, it doesn't move well alone. It doesn't need to.

bound_eye:
  name: Bound Eye
  glyph: I
  color: [170, 40, 180]
  hp: 22
  attack: 12
  defense: 1
  ai: ranged_basic
  ranged_range: 5
  # A support threat, not a primary one - low hp/defense means it dies in
  # two clean hits once actually reached, same "kill it fast or keep
  # eating chip damage" role skeleton_archer plays at the Heartlands' own
  # power level.
  xp_reward: 18
  description: A single eye, torn free of whatever it once watched for, bound in cord and sinew that shouldn't move on their own. It doesn't blink.

stitched_vanguard:
  name: Stitched Vanguard
  glyph: F
  color: [140, 60, 45]
  hp: 40
  attack: 18
  defense: 4
  ai: regenerator
  # More than one body's worth of parts means more than one body's worth
  # of hp to chip through - regen_amount 4 (up from giant_rat's 2) turns a
  # sustained fight into a real race rather than a formality
  # (docs/content_design_process.md §0u).
  regen_amount: 4
  xp_reward: 32
  description: More than one body's worth of parts, crudely joined and still working. Wounds close before they've finished opening.

hollow_chanter:
  name: Hollow Chanter
  glyph: H
  color: [190, 165, 130]
  hp: 28
  attack: 16
  defense: 2
  ai: ranged_basic
  ranged_range: 5
  # Necrotic bolts that sap strength rather than flesh outright - same
  # weaken shape as gray_ooze above, scaled to this tier's numbers. Two of
  # these landing in the same fight still only ever apply one weaken at a
  # time (refresh-not-stack, docs/content_design_process.md §0t).
  inflicts_effect: weaken
  inflicts_potency: 3
  inflicts_duration: 3
  xp_reward: 30
  description: Enough throat left to keep chanting whatever it was chanting when it died. The words don't mean anything anymore. They still work.

bound_crawler:
  name: Bound Crawler
  glyph: c
  color: [80, 75, 85]
  hp: 30
  attack: 16
  defense: 3
  ai: hostile_basic
  # A third Cinder Marches option, and the roster's first poisoner - every
  # other Visitor creation reuses regenerator/weaken/pack_hunter/enrage/
  # stun; this one bites like giant_spider's own family instead, just
  # scaled to this tier's numbers (docs/content_design_process.md §0t).
  inflicts_effect: poison
  inflicts_potency: 3
  inflicts_duration: 3
  xp_reward: 31
  description: Too many legs for what's left of the body they're stitched to, moving in a rhythm nothing alive ever settled on. It doesn't slow down to bite - it just doesn't stop.

charnel_colossus:
  name: Charnel Colossus
  glyph: L
  color: [150, 55, 15]
  hp: 48
  attack: 24
  defense: 6
  ai: enrage
  # Already capable of a near-3-hit kill against an underprepared player
  # at base stats - enraged (below 30% hp) it's closer to a 2-hit kill,
  # deliberately: this is meant to be the Hollow Reach's common patrol,
  # not a rare set-piece, so it needs to stay dangerous even once its
  # novelty wears off (docs/content_design_process.md §0u).
  enrage_hp_pct: 0.3
  enrage_attack_bonus: 5
  xp_reward: 55
  description: A heap of the dead built up into something that stands and swings. It doesn't tire, and cornered, it stops holding back.

excavation_warden:
  name: Excavation Warden
  glyph: D
  color: [95, 75, 100]
  hp: 55
  attack: 16
  defense: 8
  ai: sleeping_guard
  alert_radius: 3
  # The roster's toughest defense by a wide margin, not its hardest
  # puncher - a long, attritional fight rather than Charnel Colossus's
  # burst, made genuinely dangerous by a stun on every landed hit
  # (inflicts_duration kept at 1, matching wraith above - see
  # docs/content_design_process.md §0t's stun-lock warning: a long fight
  # means many chances for a lock to start, so whoever places this should
  # keep the wraith-precedent discipline of a solo, rare placement,
  # nothing else drawing the player's attention in the same encounter).
  # Reserved to guard the Northern Steppe's Elder Age excavation
  # sites specifically (docs/region_bibles/northern_steppe.md) - the
  # concrete, mechanical reason those sites aren't accessible yet.
  inflicts_effect: stun
  inflicts_duration: 1
  xp_reward: 65
  description: Posted at the dig and forgotten there on purpose - patient in a way nothing alive manages, and in no hurry to let anyone closer.

watch_post_sentry:
  name: Sentry
  glyph: s
  color: [150, 140, 120]
  hp: 10
  attack: 0
  defense: 0
  ai: villager
  stationary: true
  description: Keeps the watch this post is named for, same as whoever kept it before they left. Somebody has to.

# Silversilk Caves' depths (data/dungeons/silver_mountain_caves/levels/level_03
# through level_05) - the "genuinely dangerous creatures the settlers always
# avoided" the dungeon's own bible flagged past the Sealed Passage. Same
# reference-build calibration as the Northern Steppe bestiary above (see
# that block's own comment for the full "~300 XP + mid-upper gear" math) -
# a second, independent power band for a second dungeon, not a shared
# roster. Escalates across the three new levels the same tiered way:
# level_03 (challenging) -> level_04 (very dangerous) -> level_05
# (extremely dangerous, approaching Hollow Reach - the same ceiling the
# Northern Steppe's own deepest tier sets, per the user's explicit ask).

deep_spider:
  name: Deep Spider
  glyph: u
  color: [90, 30, 100]
  hp: 30
  attack: 13
  defense: 2
  ai: hostile_basic
  # A bigger, nastier cousin of giant_spider (hp20/atk7/def1, potency2) -
  # same poison shape, scaled to this dungeon's new depth tier.
  inflicts_effect: poison
  inflicts_potency: 3
  inflicts_duration: 3
  xp_reward: 20
  description: Bigger and paler than anything that hunts nearer the surface - down here, size stopped being a disadvantage generations ago.

blind_stalker:
  name: Blind Stalker
  glyph: l
  color: [90, 90, 90]
  hp: 28
  attack: 13
  defense: 2
  ai: sleeping_guard
  # Flat to the rock until the player's nearly on top of it - a much
  # tighter alert_radius than wraith's (4), matching "no eyes, relies on
  # you getting close" rather than a wide passive sense
  # (docs/content_design_process.md §0t/§0u).
  alert_radius: 2
  xp_reward: 19
  description: Flat against the rock until it isn't - no eyes worth the name, and none needed for how close it lets you get first.

broodmother:
  name: Broodmother
  glyph: q
  color: [195, 185, 145]
  hp: 42
  attack: 18
  defense: 4
  ai: regenerator
  regen_amount: 4
  xp_reward: 34
  description: Old enough to have outlived whatever first denned here. Every spider on both reaches above traces back to her, one way or another.

cave_lurker:
  name: Cave Lurker
  glyph: f
  color: [140, 20, 70]
  hp: 28
  attack: 16
  defense: 2
  ai: ranged_basic
  ranged_range: 5
  inflicts_effect: weaken
  inflicts_potency: 3
  inflicts_duration: 3
  xp_reward: 30
  description: Barely moves, doesn't need to - whatever it puts in the air does the work of closing the distance for it.

elder_widow:
  name: Elder Widow
  glyph: A
  color: [20, 15, 20]
  hp: 55
  attack: 20
  defense: 7
  ai: enrage
  # The dungeon's true apex, solo-placed at the very bottom of level_05 -
  # raw stats approaching Charnel Colossus's own burst danger, plus a
  # poison bite neither Colossus nor Excavation Warden carry, for a
  # distinct flavor of endgame threat rather than a reskin of either.
  enrage_hp_pct: 0.3
  enrage_attack_bonus: 5
  inflicts_effect: poison
  inflicts_potency: 4
  inflicts_duration: 4
  xp_reward: 65
  description: Whatever the settlers meant by "genuinely dangerous," this is almost certainly what they'd seen once and never gone looking for again.
