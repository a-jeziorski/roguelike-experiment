# Item catalog. Referenced by id from level files' legends (e.g. {item: healing_potion}).

healing_potion:
  name: Healing Potion
  glyph: "!"
  color: [220, 40, 100]
  heal_amount: 10
  cost: 25
  description: A vial of crimson liquid that mends wounds.

rusty_dagger:
  name: Rusty Dagger
  glyph: "/"
  color: [180, 180, 190]
  attack_bonus: 2
  description: Better than fists.

iron_sword:
  name: Iron Sword
  glyph: ")"
  color: [200, 200, 215]
  attack_bonus: 4
  description: A well-balanced blade, heavier and sharper than any dagger.

rusty_key:
  name: Rusty Key
  glyph: "-"
  color: [200, 170, 60]
