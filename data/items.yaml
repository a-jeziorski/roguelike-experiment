# Item catalog. Referenced by id from level files' legends (e.g. {item: healing_potion}).

healing_potion:
  name: Healing Potion
  glyph: "!"
  color: [220, 40, 100]
  heal_amount: 10
  cost: 25
  description: A vial of crimson liquid that mends wounds.

teleportation_potion:
  name: Teleportation Potion
  glyph: "?"
  color: [80, 120, 240]
  is_teleport: true
  cost: 50
  description: A vial of shifting blue liquid, cold to the touch. Drinking it pulls you clean out of wherever you are.

water_walking_potion:
  name: Water Walking Potion
  glyph: "~"
  color: [50, 190, 180]
  water_walking_duration: 20
  description: A vial of something the color of deep water. Drink it and your own feet forget how to sink.

antidote_potion:
  name: Antidote
  glyph: "!"
  color: [90, 200, 90]
  cures_effects: true
  cost: 20
  description: A bitter green draught. Whatever's wrong with you right now, it isn't anymore.

vigor_elixir:
  name: Elixir of Vigor
  glyph: "!"
  color: [230, 130, 40]
  grants_buff: vigor
  buff_potency: 3
  buff_duration: 10
  cost: 40
  description: A vial of something thick and amber, warm even through the glass. Drink it and feel your own strength come up to meet you.

swiftness_draught:
  name: Draught of Swiftness
  glyph: "!"
  color: [90, 220, 230]
  grants_buff: haste
  buff_duration: 3
  cost: 55
  description: A vial that fizzes faintly, cold as running water. Drink it and the world outside seems, just for a moment, to fall a half-step behind.

shadow_vial:
  name: Vial of Shadows
  glyph: "!"
  color: [70, 60, 100]
  grants_buff: shadowed
  buff_duration: 8
  cost: 45
  description: A vial of liquid darker than the glass that holds it. Drink it and the space around you stops quite reaching the eye - so long as nothing's already close enough to touch.

rusty_dagger:
  name: Rusty Dagger
  glyph: "/"
  color: [180, 180, 190]
  attack_bonus: 2
  cost: 15
  description: Better than fists.

iron_sword:
  name: Iron Sword
  glyph: ")"
  color: [200, 200, 215]
  attack_bonus: 4
  description: A well-balanced blade, heavier and sharper than any dagger.

broadsword:
  name: Broadsword
  glyph: "\\"
  color: [190, 190, 200]
  attack_bonus: 5
  description: Wider and heavier than any blade a dungeon guard was issued. Takes both hands to swing well.

battle_axe:
  name: Battle Axe
  glyph: "&"
  color: [170, 160, 150]
  attack_bonus: 6
  description: Built to cleave, not parry. Whoever swung this last wasn't planning on a second exchange.

war_hammer:
  name: War Hammer
  glyph: P
  color: [140, 130, 120]
  attack_bonus: 7
  description: All the subtlety of a collapsing wall, and about as easy to argue with.

rusty_key:
  name: Rusty Key
  glyph: "-"
  color: [200, 170, 60]
  is_key: true
  description: A tarnished brass key. It might fit a nearby lock.

leather_armor:
  name: Leather Armor
  glyph: "["
  color: [150, 110, 60]
  defense_bonus: 1
  cost: 20
  description: Cracked but serviceable hide armor, better than bare skin.

bone_plate:
  name: Bone Plate
  glyph: "]"
  color: [220, 220, 200]
  defense_bonus: 3
  description: Armor fashioned from the ossuary's dead. Unsettling, but it holds.

studded_leather_armor:
  name: Studded Leather Armor
  glyph: "{"
  color: [130, 95, 55]
  defense_bonus: 2
  description: Leather reinforced with a lattice of iron studs. Not much heavier, considerably harder to open up.

chain_mail:
  name: Chain Mail
  glyph: "<"
  color: [180, 185, 195]
  defense_bonus: 4
  description: Thousands of interlocking rings, all of it Old Kingdom-issue. Whoever wore it last isn't wearing it now.

banded_mail:
  name: Banded Mail
  glyph: ":"
  color: [160, 155, 130]
  defense_bonus: 6
  description: Overlapping steel bands over a leather backing. Heavy enough that you'll feel every hour of it, and glad of that in the one hour it matters.

hunting_bow:
  name: Hunting Bow
  glyph: "}"
  color: [160, 120, 70]
  ranged_attack_bonus: 3
  range: 5
  description: A worn hunting bow. Strike from a distance before they close in.

orcish_bow:
  name: Orcish Bow
  glyph: "+"
  color: [100, 90, 60]
  ranged_attack_bonus: 4
  range: 5
  description: Crude and asymmetric, strung with something you'd rather not ask about. Still shoots true.

crossbow:
  name: Crossbow
  glyph: ";"
  color: [110, 95, 75]
  ranged_attack_bonus: 6
  range: 4
  description: Slower to draw than a bow, and it doesn't matter once the bolt lands. Trades reach for a much harder hit.

elder_bow:
  name: Elder Bow
  glyph: "("
  color: [150, 190, 170]
  ranged_attack_bonus: 5
  range: 6
  description: Finer work than anything the Kingdom's armories turned out - light, silent, and older than whoever last strung it.

arrows:
  name: Arrows
  glyph: "|"
  color: [190, 170, 140]
  is_ammo: true
  quantity: 5
  description: A bundle of fletched arrows.

lucky_charm:
  name: Lucky Charm
  glyph: "'"
  color: [230, 200, 90]
  trinket_effect: crit_chance
  trinket_bonus: 0.1
  cost: 60
  description: A rabbit's-foot sort of thing, worn smooth by whoever carried it before. Doubles your odds of a lucky, telling blow.

shadow_cloak_pin:
  name: Shadow Cloak Pin
  glyph: "^"
  color: [90, 90, 120]
  trinket_effect: dodge_chance
  trinket_bonus: 0.1
  cost: 60
  description: A dull iron pin that seems to drink the light around it. Makes a body just a little harder to hit.

scholars_pendant:
  name: Scholar's Pendant
  glyph: "~"
  color: [150, 180, 210]
  trinket_effect: xp_gain
  trinket_bonus: 0.2
  cost: 75
  description: A pendant etched with notes too small to read without squinting. Sharpens the habit of learning from everything that happens to you.

venomous_dagger:
  name: Venomous Dagger
  glyph: "`"
  color: [90, 150, 70]
  attack_bonus: 2
  affix_effect: poison
  affix_potency: 1
  affix_duration: 3
  affix_chance: 0.3
  cost: 45
  description: A dagger with a hollow fuller, packed with something that never quite dries. Sometimes the cut is the least of it.

thorned_plate:
  name: Thorned Plate
  glyph: "_"
  color: [120, 90, 60]
  defense_bonus: 2
  affix_effect: weaken
  affix_potency: 2
  affix_duration: 2
  affix_chance: 0.3
  cost: 45
  description: Armor studded with something that bites back. Whoever strikes you here doesn't walk away unmarked.

gold_pile:
  name: Gold Pile
  glyph: "$"
  color: [255, 210, 60]
  gold_amount: 10
  description: A modest handful of coin - old minting, still real weight in the hand.

gold_stash:
  name: Gold Stash
  glyph: "*"
  color: [255, 225, 90]
  gold_amount: 25
  description: More coin than anyone carries by accident. Someone meant to come back for this.

pale_fungus:
  name: Pale Fungus
  glyph: "%"
  color: [180, 200, 150]
  description: Grows only where standing water's been left untouched for years. Not for eating.

road_ledger:
  name: Road Ledger
  glyph: "="
  color: [200, 190, 160]
  description: A water-stained Kingdom ledger, listing roads and waystations nobody's maintained in a generation. Worth more to a clerk than to anyone who took this place.

waystation_manifest:
  name: Waystation Manifest
  glyph: "="
  color: [140, 175, 195]
  description: A waterlogged shipping manifest from the Drowned Waystation, its ink long since run - the stamped seals on the cover are still legible, if nothing else.
