# Item catalog. Referenced by id from level files' legends (e.g. {item: healing_potion}).

healing_potion:
  name: Healing Potion
  glyph: "!"
  color: [220, 40, 100]
  heal_amount: 10
  cost: 25
  description: A vial of crimson liquid that mends wounds.

teleportation_potion:
  name: Teleportation Potion
  glyph: "?"
  color: [80, 120, 240]
  is_teleport: true
  cost: 50
  description: A vial of shifting blue liquid, cold to the touch. Drinking it pulls you clean out of wherever you are.

rusty_dagger:
  name: Rusty Dagger
  glyph: "/"
  color: [180, 180, 190]
  attack_bonus: 2
  cost: 15
  description: Better than fists.

iron_sword:
  name: Iron Sword
  glyph: ")"
  color: [200, 200, 215]
  attack_bonus: 4
  description: A well-balanced blade, heavier and sharper than any dagger.

rusty_key:
  name: Rusty Key
  glyph: "-"
  color: [200, 170, 60]
  is_key: true
  description: A tarnished brass key. It might fit a nearby lock.

leather_armor:
  name: Leather Armor
  glyph: "["
  color: [150, 110, 60]
  defense_bonus: 1
  cost: 20
  description: Cracked but serviceable hide armor, better than bare skin.

bone_plate:
  name: Bone Plate
  glyph: "]"
  color: [220, 220, 200]
  defense_bonus: 3
  description: Armor fashioned from the ossuary's dead. Unsettling, but it holds.

hunting_bow:
  name: Hunting Bow
  glyph: "}"
  color: [160, 120, 70]
  ranged_attack_bonus: 3
  range: 5
  description: A worn hunting bow. Strike from a distance before they close in.

arrows:
  name: Arrows
  glyph: "|"
  color: [190, 170, 140]
  is_ammo: true
  quantity: 5
  description: A bundle of fletched arrows.

gold_pile:
  name: Gold Pile
  glyph: "$"
  color: [255, 210, 60]
  gold_amount: 10
  description: A modest handful of coin - old minting, still real weight in the hand.

gold_stash:
  name: Gold Stash
  glyph: "*"
  color: [255, 225, 90]
  gold_amount: 25
  description: More coin than anyone carries by accident. Someone meant to come back for this.

pale_fungus:
  name: Pale Fungus
  glyph: "%"
  color: [180, 200, 150]
  description: Grows only where standing water's been left untouched for years. Not for eating.

road_ledger:
  name: Road Ledger
  glyph: "="
  color: [200, 190, 160]
  description: A water-stained Kingdom ledger, listing roads and waystations nobody's maintained in a generation. Worth more to a clerk than to anyone who took this place.
