# Quest catalog. Each entry is one quest - see content/schema.py's QuestDef
# for the full field list and content/loader.py's load_quests for validation
# (catalog references, trigger-shape/deadline rules). A quest completes via
# exactly one trigger shape: target_dungeon_id (arriving somewhere, then
# reporting it to questgiver_entity_id), target_entity_id (talking to
# someone - the one single-step shape), target_kill_entity_id (killing a
# specific catalog entity, then reporting it to questgiver_entity_id),
# target_item_id (delivering a specific item to questgiver_entity_id while
# holding it), or target_intimidate_entity_id (hitting - not killing - a
# specific peaceful catalog entity, then reporting it to
# questgiver_entity_id; killing the target instead force-fails the quest
# immediately) - see engine/quest.py for what each one actually checks. The
# dungeon-arrival, kill, fetch, and intimidate shapes are all two steps: the
# deed (arriving/killing/picking up/hitting) alone never completes anything,
# only reporting back to the questgiver does.
#
# description is only the quest log's *starting* pane text - completed_
# description/failed_description, carrying_item_description (fetch quests,
# once the item's in inventory), target_dead_description (kill quests, once
# the target's been recorded dead), target_visited_description
# (dungeon-arrival quests, once the dungeon's been recorded visited), and
# target_intimidated_description (intimidate quests, once the target's been
# recorded intimidated) override it once the quest actually progresses; see
# Quest.current_description (engine/quest.py) for exactly when each one
# applies. Leave any of them unset ("") to just keep showing `description`
# at that stage.
#
# requires_quest_id chains one quest behind another: a not_given quest with
# it set is never granted by QuestLog.check_questgiver until the referenced
# quest's own status is "completed" (requires questgiver_entity_id too, same
# as every other completion-adjacent field). See spreading_the_warning for
# the first real use - gated on goblin_warning, so the Village Chief only
# offers his follow-up once the original warning's actually been delivered.

goblin_warning:
  name: The Goblin Warning
  description: >
    Before your capture, you were carrying word to Millhaven: a goblin
    horde is migrating into the region, and the town needs warning before
    it arrives. No letter, no proof - just what you were told, and who
    you can get to listen.
  completed_description: >
    You found the Village Chief and told them everything you knew - the
    horde, the timing, all of it. The warning's been passed on. What
    Millhaven does with it now is out of your hands.
  failed_description: >
    The deadline came and went before you ever found the Village Chief.
    Whatever warning you were carrying, it never reached anyone in time -
    if the horde's already on its way, nobody in Millhaven had the chance
    to prepare for it.
  completion_message: The warning is passed on - what Millhaven does with it now isn't yours to carry anymore.
  failure_message: The deadline for the warning has passed. Whatever time Millhaven had to prepare, it's gone now.
  target_done_dialogue: The warning's out now - the town knows what's coming, thanks to you. Whatever happens next, at least we won't be caught flat-footed.
  deadline_year: 87
  deadline_day: 57
  target_entity_id: village_chief
  starting_status: in_progress
  reward_xp_amount: 15

kill_the_warden:
  name: An Old Debt
  description: >
    Another prisoner who made it out asked you for a favor: the Warden of
    Prison Tower doesn't get to just walk away from what he did there.
    Whether he's already paid for it or not is something you'd know
    better than they would.
  target_dead_description: >
    The Warden's dead - you saw to that yourself. Whatever he did to the
    people under him doesn't matter anymore; what's left is telling the
    prisoner who asked. Get back to them in Millhaven.
  completed_description: >
    The Warden is dead - by your hand, whether during the escape or after.
    You went back and told the prisoner who asked; they didn't say much,
    but they pressed a Healing Potion into your hands before you left.
  completion_message: The Warden is dead. Whatever he did to the people under him, he won't do it to anyone else now.
  given_message: "New quest: An Old Debt - if the Warden of Prison Tower is still alive, he won't be for long if you have anything to say about it."
  already_done_message: You tell them it's already done - the Warden didn't survive your escape. They go quiet for a moment. 'Good,' they say, finally. 'Good.'
  questgiver_done_dialogue: The Warden's dead. Didn't think I'd ever get to hear that and mean it as good news.
  questgiver_entity_id: escaped_prisoner
  target_kill_entity_id: warden
  reward_item_id: healing_potion
  reward_xp_amount: 25

fetch_fungus:
  name: A Standing Request
  description: >
    The shopkeeper's after a specific fungus - pale stuff that only grows
    where groundwater in the Sunken Mine has sat undisturbed for years.
    They didn't say what it's for. Bring it back and there's coin in it,
    one way or another.
  carrying_item_description: >
    You've got the fungus - pale, damp, exactly what the shopkeeper
    described. It's not worth much to anyone else. Bring it back to them
    in Millhaven to collect whatever they're offering for it.
  completed_description: >
    You brought the fungus back and the shopkeeper took it without much
    explanation. What you got in return was concrete enough, though: a
    standing 20% discount on everything they sell, for as long as you're
    both still here.
  completion_message: The shopkeeper takes the fungus, turns it over once, and nods. 'Knew you'd manage.' Whatever it's for, that's between them and it now.
  given_message: "New quest: A Standing Request - the shopkeeper wants a pale fungus that only grows near standing water deep in the Sunken Mine."
  questgiver_done_dialogue: Found what I was after, did you? Coin's worth more to you here now, at least.
  questgiver_entity_id: shopkeeper
  target_item_id: pale_fungus
  reward_shop_discount_pct: 0.2
  reward_shop_discount_entity_id: shopkeeper
  reward_xp_amount: 20

clearing_the_watch_road:
  name: Clearing the Watch Road
  description: >
    The Road Warden wants the bandit captain holding Broken Watch dealt
    with - not the whole nest, just whoever's currently running it. Take
    out the one actually organizing the raids, and the road west opens
    back up.
  target_dead_description: >
    The captain's dead - you saw to that yourself, at Broken Watch.
    Whatever's left of his rickety little hierarchy isn't your problem.
    Get back to Wayford and let the Road Warden know the road's clear.
  completed_description: >
    The captain's dead, and you went back and told the Road Warden
    yourself. They don't ask for details - just hand over a set of bone
    plate armor, salvaged from who knows where, and call it a fair trade
    for a clear road.
  completion_message: The captain's dead. Whatever this cost him to hold that tower, it's someone else's problem now - if anyone even bothers.
  failed_description: >
    Wayford's gone - burned before you ever got back to report the
    captain's death. Whatever the Road Warden meant to do about Broken
    Watch, that's nobody's problem to hand off to now.
  given_message: "New quest: Clearing the Watch Road - the Road Warden wants whoever's leading the bandits at Broken Watch dealt with, so the road west is safe to use again."
  failure_message: "There's no one left in Wayford to hear about Broken Watch. Whatever came of that captain's death, it doesn't reach anyone there anymore."
  questgiver_done_dialogue: Word's already reached me - the road's clear. Don't know who's fool enough to try holding that tower next, but it won't be for a while.
  questgiver_entity_id: wayford_road_warden
  target_kill_entity_id: bandit_captain
  reward_item_id: bone_plate
  reward_xp_amount: 25
  voided_by_dungeon_id: wayford

a_record_worth_keeping:
  name: A Record Worth Keeping
  description: >
    The Town Clerk wants an old route ledger recovered from Broken
    Watch - Kingdom paperwork the bandits never had any use for, showing
    which roads and waystations still connect. Nobody there will miss it.
  carrying_item_description: >
    You've got the ledger - water-stained but the ink's mostly held.
    Whatever it's worth to the Clerk, it's not worth anything to whoever
    left it behind at Broken Watch. Bring it back to Wayford.
  completed_description: >
    The Clerk goes quiet reading through it, longer than you'd expect for
    a stack of old paper. In the end they count out coin from the town's
    own strongbox - requisitioned, not gifted, they're careful to point
    out - and thank you like they mean it.
  completion_message: The ledger changes hands. Whatever those old roads used to connect, someone in Wayford cares enough now to write it back down.
  failed_description: >
    The Clerk's office is ash now, same as the rest of Wayford. Whatever
    that old ledger might have proven, there's no one left there who'd
    have cared to read it.
  given_message: "New quest: A Record Worth Keeping - the Town Clerk wants an old route ledger recovered from Broken Watch, left behind in whatever passed for its duty room."
  failure_message: "The Town Clerk won't be reading that ledger. Wayford isn't there to read anything, anymore."
  questgiver_done_dialogue: Every road we used to keep, listed plain as anything. Worth more than what I just paid you for it, and I mean that literally.
  questgiver_entity_id: wayford_clerk
  target_item_id: road_ledger
  reward_gold_amount: 30
  reward_xp_amount: 20
  voided_by_dungeon_id: wayford

word_down_the_road:
  name: Word Down the Road
  description: >
    The Caravan Master wants proof the road to Millhaven still holds
    before committing a cart to it - nothing to fight, nothing to fetch,
    just make the trip and see for yourself that it's still passable.
  target_visited_description: >
    You've made the trip to Millhaven and the road held the whole way.
    That's the proof the Caravan Master wanted - get back to Wayford and
    let them know.
  completed_description: >
    You made it to Millhaven and back with nothing to report, which is
    exactly what the Caravan Master wanted to hear. A cart's going out
    again before the season's through - the first one in longer than
    anyone here will admit to.
  completion_message: The road holds. Whatever else has changed, that much hasn't.
  failed_description: >
    There's no cart leaving Wayford for Millhaven, not anymore, and no
    Caravan Master left to send one. Whatever proof you gathered on that
    road, it has nowhere left to go.
  given_message: "New quest: Word Down the Road - the Caravan Master wants proof the road to Millhaven is still safe to travel, before risking an actual caravan on it."
  failure_message: "The Caravan Master isn't waiting on that news. Wayford isn't waiting on anything, anymore."
  already_done_message: You tell the Caravan Master the road's already proven itself - you made that trip before they ever asked. They don't seem to mind hearing it secondhand. 'Good enough,' they say. 'Cart goes out either way.'
  questgiver_done_dialogue: You made it there and back in one piece - that's all I needed to hear. I'll get a cart moving before the season's out.
  questgiver_entity_id: wayford_caravan_master
  target_dungeon_id: millhaven
  reward_xp_amount: 15
  voided_by_dungeon_id: wayford

spreading_the_warning:
  name: Spreading the Warning
  description: >
    The Village Chief wants the goblin warning carried on to Wayford's
    Road Warden - a horde moving through the region is exactly the kind
    of thing he'd want to hear about first. Same as before: nothing
    written down, just what you know, told to him in person.
  completed_description: >
    You carried the warning on to Wayford yourself and told the Road
    Warden in person - no letter, same as with the Chief. He didn't seem
    surprised, just grim. Whatever's moving out there, two towns are
    watching for it now instead of one.
  failed_description: >
    The deadline passed before you ever reached Wayford's Road Warden.
    What the horde did with that unguarded warning, you didn't have to
    guess for long - the road east doesn't lead to a town anymore.
  completion_message: The warning's passed on again - Wayford knows what's coming now too, same as Millhaven did.
  failure_message: "Too late. Word never reached Wayford in time - if the horde was already close, there was nothing left to slow it down."
  given_message: "New quest: Spreading the Warning - the Village Chief wants the goblin warning carried on to Wayford's Road Warden, before the horde gets there first."
  questgiver_done_dialogue: Word's on its way to Wayford now, thanks to you. Whatever's coming, at least two towns will see it before it arrives instead of one.
  target_done_dialogue: Goblins on the move, is it. Wouldn't be the first horde to think this crossroads makes an easy path through. We'll keep eyes on the eastern road - appreciate the warning, whatever it's worth.
  questgiver_entity_id: village_chief
  requires_quest_id: goblin_warning
  target_entity_id: wayford_road_warden
  deadline_year: 87
  deadline_day: 64
  reward_xp_amount: 15
  on_fail:
    - destroy_dungeon_id: wayford
    - set_flag: wayford_razed
    - tighten_deadline: { quest_id: a_wall_worth_holding, new_day: 66 }

a_wall_worth_holding:
  name: A Wall Worth Holding
  description: >
    The Lookout's counted too many watch-fires on the hills toward Broken
    Watch these last few nights - more than idle bandits keep lit.
    Whoever's leading them out there needs to be dealt with before those
    fires start meaning something more than firelight.
  target_dead_description: >
    The captain's dead - word travels fast on a road this quiet. Get back
    up to the lookout post and let them know the hill's gone dark again.
  completed_description: >
    The captain's dead, and the Lookout's watched three nights straight
    without a single fire on the hill to report. Whatever this cost, it
    bought Stonebridge some actual quiet, not just the practiced kind.
  failed_description: >
    Nobody dealt with Broken Watch in time, and the hill stopped just
    glowing at night. Stonebridge held its wall as long as it could -
    what's left of the town is smaller for it, and everyone here knows
    exactly how close a warning that goes unanswered comes to this.
  completion_message: The fires on the hill are out. However long that lasts, it's more than Stonebridge had before you.
  failure_message: "The fires on the hill came down off the hill. Stonebridge is still standing - not everyone in it is."
  given_message: "New quest: A Wall Worth Holding - the Lookout wants whoever's leading the bandits at Broken Watch dealt with, before their watch-fires turn into an actual raid."
  questgiver_done_dialogue: Hill's been dark three nights running, thanks to you. I'd almost forgotten what that looked like.
  questgiver_entity_id: stonebridge_lookout
  target_kill_entity_id: bandit_captain
  deadline_year: 87
  deadline_day: 70
  reward_gold_amount: 25
  reward_xp_amount: 25
  on_fail:
    - set_flag: stonebridge_raided

what_the_tide_kept:
  name: What the Tide Kept
  description: >
    The Elder remembers when boats still stopped at the Drowned
    Waystation, before the sea took it whole - and wants proof of what
    this coast used to trade, if anything of its old paperwork survived
    the flood.
  carrying_item_description: >
    You've got the manifest - waterlogged, but the seals still hold.
    Whatever it says about this coast's old trade, it's not worth
    anything left sitting in a ruin. Bring it back to Saltmarsh.
  completed_description: >
    The Elder reads slower than the water damage should really allow,
    tracing what's left of the old shipping lists with one finger. In the
    end they just nod, like something's been confirmed rather than
    learned, and press a little coin into your hand for the trouble.
  completion_message: The Elder reads every legible line twice before setting it down. Whatever it confirmed, they don't say - just thank you, and mean it.
  given_message: "New quest: What the Tide Kept - the Elder wants an old shipping manifest recovered from the Drowned Waystation, if any of it survived the flood."
  questgiver_done_dialogue: Still turning that manifest over some nights, if you're wondering. Coast remembers longer than people do, given the chance.
  questgiver_entity_id: saltmarsh_elder
  target_item_id: waystation_manifest
  reward_gold_amount: 15
  reward_xp_amount: 20

the_uninvited_tribe:
  name: The Uninvited Tribe
  description: >
    Part of the Goblin Horde that broke apart near Wayford has moved into
    the upper reaches of Silversilk Caves - the Monastery's own hunting
    grounds. The Elder wants the goblins cleared out entirely. The catch:
    the caves' cave spiders are the whole reason this place survives at
    all, and killing too many of them while you're at it undoes whatever
    good the clearing was supposed to do.
  target_cleared_description: >
    The goblins are gone - every last one of them, as far as you could
    tell. Get back to Grey Valley Monastery and let the Elder know the
    upper caves are theirs again.
  completed_description: >
    The goblins are cleared, and the cave spiders are still there to be
    hunted - shaken, thinner in some corners than others, but a real
    population, not a memory of one. The Elder doesn't say much, just
    looks toward the caves like something's finally settled.
  failed_description: >
    Too many spiders died getting the goblins out. The caves are quiet
    now, but quiet isn't the same as fed - whatever's left hunting there
    won't be enough to keep this place the way it was.
  completion_message: The upper caves are goblin-free, and the spiders are still there to be hunted. Whatever this cost, it kept the one thing this place actually needed.
  failure_message: The goblins are gone, but so are too many of the spiders. The Monastery's hunting grounds survived the clearing in name only.
  given_message: "New quest: The Uninvited Tribe - the Elder wants the goblins cleared out of Silversilk Caves' upper reaches, without wiping out the cave spiders the Monastery depends on."
  questgiver_done_dialogue: The caves are quiet again, and the spiders are still there to be hunted - both things I wasn't sure I'd get to say in the same breath. Whatever this cost you, it was worth it to us.
  questgiver_entity_id: grey_valley_elder
  target_cull_entity_id: goblin
  target_preserve_entity_id: cave_spider
  target_preserve_tolerance: 5
  available_after_year: 87
  available_after_day: 67
  reward_gold_amount: 40
  reward_xp_amount: 30

reclaiming_the_windrest:
  name: Reclaiming the Windrest
  description: >
    The Windrest, the one real shelter for miles, is held by Opportunists
    who took it for its walls, nothing more. The Captain wants whoever's
    running things there dealt with - not the whole band, just the one
    holding the best-sealed room. Windbreak Hold can't spare anyone to do
    it themselves.
  target_dead_description: >
    The captain's dead - you saw to that yourself, at the Windrest.
    Whatever's left of that shelter's occupants isn't your problem. Get
    back to Windbreak Hold and let the Captain know.
  completed_description: >
    The captain's dead, and you went back and told the Captain yourself.
    They don't say much - just look toward the Windrest for a long
    moment, like they're already picturing real walls instead of the
    ones they built by hand.
  completion_message: The captain's dead. Whatever's left holding the Windrest, it isn't in charge of anything anymore.
  given_message: "New quest: Reclaiming the Windrest - the Captain wants whoever's leading the Opportunists at the Windrest dealt with, so Windbreak Hold has a real shelter to move into."
  questgiver_done_dialogue: Word's already reached me - the Windrest's leaderless. Won't be long before we've got real walls again, thanks to you.
  questgiver_entity_id: windbreak_captain
  target_kill_entity_id: windrest_captain
  reward_gold_amount: 25
  reward_xp_amount: 25

a_debt_worth_collecting:
  name: A Debt Worth Collecting
  description: >
    The Provisioner is owed coin by a debtor who ran off to Millhaven
    thinking distance would settle it. They don't want the debtor dead -
    a corpse doesn't pay - just rattled enough to remember what's owed.
    Make your point, then leave them breathing.
  target_intimidated_description: >
    The debtor's rattled and still breathing - exactly what the
    Provisioner asked for. Get back to Wayford and let them know the
    message landed.
  completed_description: >
    You told the Provisioner it's done - the debtor's had their scare and
    lived to remember it. The Provisioner counts out a share of whatever
    gets collected, no questions about how you made your point.
  failed_description: >
    The debtor's dead. Whatever the Provisioner was owed, a corpse in
    Millhaven isn't going to pay it - and Millhaven's guards haven't
    forgotten who came through swinging.
  completion_message: The debtor's alive and considerably more motivated to pay. That's worth more to the Provisioner than a body ever would've been.
  given_message: "New quest: A Debt Worth Collecting - the Provisioner wants a debtor in Millhaven roughed up, not killed, as a reminder of what's owed."
  failure_message: "The debtor's dead, and dead men don't pay. Whatever the Provisioner was owed, it isn't coming back now."
  questgiver_done_dialogue: Debt's as good as collected now, thanks to a little reminder. Didn't need to hear the details.
  questgiver_entity_id: wayford_provisioner
  target_intimidate_entity_id: millhaven_debtor
  reward_gold_amount: 20
  reward_xp_amount: 25
